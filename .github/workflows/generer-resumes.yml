# =============================================================================
# Résumés « en clair » des lois votées — brouillons par IA (Mistral), 26/11/2026.
#
# DEUX DÉCLENCHEMENTS :
# - à la main (Actions > Résumés en clair > Run workflow) : mode « essai » par défaut,
#   le modèle répond, les contrôles tournent, RIEN n'est écrit ;
# - EN LOT, chaque dimanche (porteur, 27/11/2026 : « générer les brouillons en batch sans
#   que j'aie à cliquer ») : mode « brouillons », 10 textes au plus. Coût signalé au
#   porteur avant activation (de l'ordre de quelques centimes par semaine au tarif
#   affiché par Mistral, NON VÉRIFIÉ ; le nombre réel de jetons s'écrit à la fin du run).
#
# LES BROUILLONS VIVENT SUR UNE BRANCHE FIXE, `brouillons/resumes`, avec UNE pull request
# ouverte qui s'enrichit de semaine en semaine. Chaque lancement repart de cette branche :
# un texte déjà en brouillon (relu ou non) est sauté (--deja), donc jamais payé deux fois.
# Rien n'arrive sur main sans que le porteur fusionne ; rien ne s'affiche avant valide: true.
#
# Chaîne (docs/resumes-ia.md) :
#   1. catalogue des scrutins publiés (extract-html.js) → dossiers législatifs concernés ;
#   2. archive « Dossiers législatifs » de l'Assemblée (la même que la collecte) ;
#   3. textes-officiels.mjs : PDF officiel du texte déposé, exposé des motifs ;
#   4. generer_resumes.mjs : brouillon par Mistral, contrôles, valide: false ;
#   5. hors essai : une branche et une pull request de brouillons. Le porteur relit,
#      pose valide: true à la main, puis publie (resumes-clairs.mjs --publier).
# Jamais rien sur main sans relecture : rien ne s'affiche avant valide: true.
#
# Secret requis : MISTRAL_API_KEY (Settings > Secrets and variables > Actions).
# =============================================================================

name: Résumés en clair

on:
  schedule:
    # Dimanche 04:23 UTC : la collecte du samedi est passée (elle part vers 16 h UTC), minute décalée pour éviter
    # l'heure pleine (GitHub retarde les crons à :00).
    - cron: "23 4 * * 0"
  workflow_dispatch:
    inputs:
      # Un seul menu (26/11/2026, porteur : lancer depuis le téléphone, sans PC).
      mode:
        description: "simulation : aucun appel, gratuit · essai : Mistral répond, rien n'est écrit · brouillons : Mistral répond, PR de brouillons valide: false"
        type: choice
        options: [essai, simulation, brouillons]
        default: essai
      limite:
        description: "Nombre maximal de dossiers par lancement"
        type: number
        default: 5

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: generer-resumes
  cancel-in-progress: false

jobs:
  resumes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Réglages du lancement
        id: reglages
        run: |
          # En lot (schedule), pas de menu : brouillons, 10 textes au plus.
          echo "mode=${{ inputs.mode || 'brouillons' }}" >> "$GITHUB_OUTPUT"
          echo "limite=${{ inputs.limite || 10 }}" >> "$GITHUB_OUTPUT"
          echo "Mode : ${{ inputs.mode || 'brouillons' }}, limite : ${{ inputs.limite || 10 }} (déclencheur : ${{ github.event_name }})" >> "$GITHUB_STEP_SUMMARY"

      - name: Repartir de la branche des brouillons (textes déjà faits sautés)
        if: steps.reglages.outputs.mode == 'brouillons'
        run: |
          git config user.name "Collecte Repere"
          git config user.email "repere0@protonmail.com"
          if git ls-remote --exit-code --heads origin brouillons/resumes > /dev/null; then
            git fetch -q origin brouillons/resumes
            git switch -q -C brouillons/resumes FETCH_HEAD
            # La branche ne porte que des brouillons : main y entre sans conflit, pour les scripts à jour.
            git merge -q --no-edit origin/main -m "Brouillons de résumés : main à jour"
          else
            git switch -q -C brouillons/resumes
          fi
          echo "Brouillons déjà sur la branche : $(ls data/resumes 2>/dev/null | grep -c '\.json$' || true)" >> "$GITHUB_STEP_SUMMARY"

      - name: Outils (pdftotext)
        run: |
          node --version
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          pdftotext -v 2>&1 | head -1

      - name: Catalogue des scrutins publiés
        working-directory: mono
        run: node scripts/extract-html.js ../app_repere_v18_20.html ./data > /dev/null

      - name: Archive des dossiers législatifs de l'Assemblée
        run: |
          mkdir -p "$RUNNER_TEMP/an"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/an/dossiers.zip" \
            "https://data.assemblee-nationale.fr/static/openData/repository/17/loi/dossiers_legislatifs/Dossiers_Legislatifs.json.zip"
          unzip -oq "$RUNNER_TEMP/an/dossiers.zip" -d "$RUNNER_TEMP/an/brut"

      - name: Textes officiels (exposés des motifs)
        working-directory: mono
        run: |
          node scripts/textes-officiels.mjs --archive "$RUNNER_TEMP/an/brut" --scrutins data/scrutins.json \
            --sortie "$RUNNER_TEMP/officiels" --deja ../data/resumes --limite "${{ steps.reglages.outputs.limite }}"

      # Votes de la semaine (porteur, 27/11/2026, décisions 3 et 5) : la fiche officielle de chaque scrutin des 7
      # derniers jours, sans ceux déjà en brouillon. Même limite que les lois : 2 x limite textes au plus par lot.
      - name: Votes de la semaine (fiches des scrutins)
        working-directory: mono
        run: |
          node scripts/sources-explications.mjs --donnees data --sortie "$RUNNER_TEMP/votes" \
            --depuis "$(date -u -d '7 days ago' +%F)" --deja ../data/resumes --limite "${{ steps.reglages.outputs.limite }}"
          jq -s 'add' "$RUNNER_TEMP/officiels/lots.json" "$RUNNER_TEMP/votes/lots.json" > "$RUNNER_TEMP/lots.json"

      - name: Brouillons de résumés
        working-directory: mono
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          OPTIONS=""
          case "${{ steps.reglages.outputs.mode }}" in
            simulation) OPTIONS="--mock --essai" ;;
            essai) OPTIONS="--essai" ;;
            brouillons) OPTIONS="" ;;
            *) echo "::error::Mode inconnu : ${{ steps.reglages.outputs.mode }}"; exit 1 ;;
          esac
          if [ "${{ steps.reglages.outputs.mode }}" != "simulation" ] && [ -z "$MISTRAL_API_KEY" ]; then
            echo "::error::Secret MISTRAL_API_KEY absent : rien n'est appelé."; exit 1; fi
          node scripts/generer_resumes.mjs --liste "$RUNNER_TEMP/lots.json" $OPTIONS | tee "$RUNNER_TEMP/compte-rendu.txt"
          { echo '```'; cat "$RUNNER_TEMP/compte-rendu.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Garder les textes et le compte rendu (7 jours)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resumes-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/officiels
            ${{ runner.temp }}/votes
            ${{ runner.temp }}/compte-rendu.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Pull request de brouillons (mode brouillons seulement)
        if: steps.reglages.outputs.mode == 'brouillons'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain data/resumes)" ]; then echo "Aucun brouillon nouveau cette fois." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          # Garde : un brouillon ne porte jamais valide: true (seul le porteur le pose).
          NOUVEAUX=$(git status --porcelain data/resumes | awk '{print $2}' | grep '\.json$' || true)
          if [ -n "$NOUVEAUX" ] && grep -l '"valide": *true' $NOUVEAUX 2>/dev/null; then
            echo "::error::Un brouillon porte valide: true : refusé."; exit 1; fi
          git add data/resumes
          git commit -q -m "Brouillons de résumés en clair du $(TZ=Europe/Paris date +%d/%m/%Y) (Mistral, valide: false)"
          git push -q origin brouillons/resumes
          echo "Brouillons poussés sur brouillons/resumes : $(echo "$NOUVEAUX" | grep -c . ) nouveau(x)." >> "$GITHUB_STEP_SUMMARY"
          if [ "$(gh pr list --head brouillons/resumes --state open --json number --jq length)" = "0" ]; then
            gh pr create --base main --head brouillons/resumes --title "Brouillons de résumés en clair à relire" \
              --body "Brouillons écrits par Mistral à partir des exposés des motifs officiels, tous en valide: false. Cette PR s'enrichit chaque dimanche. À relire un par un : poser valide: true sur ceux qui sont justes, puis resumes-clairs.mjs --publier. Rien ne s'affiche avant." \
              || echo "::warning::Pull request non créée (réglage du dépôt ?). La branche brouillons/resumes est poussée : ouvrir la PR à la main."
          else
            echo "La pull request des brouillons est déjà ouverte : elle reçoit ce commit." >> "$GITHUB_STEP_SUMMARY"
          fi
