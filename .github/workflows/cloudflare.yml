name: Cloudflare Pages (application web)

# DEPLOIEMENT DE L'APPLICATION WEB SUR CLOUDFLARE PAGES — 17/11/2026 (docs/hebergement-cloudflare.md).
#
# QUAND :
#   - un push sur main qui touche l'application ou le socle ;
#   - la fin d'une collecte quotidienne reussie sur main : l'application copie a son build les donnees publiees
#     sur Netlify (scripts/miroir-donnees.mjs), il faut donc la reconstruire APRES la publication du jour ;
#   - a la main (workflow_dispatch).
#
# OPT-IN : sans les deux secrets CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID, le job s'arrete a la premiere etape
# et le dit. Rien n'est deploye, rien n'echoue. A ne PAS combiner avec l'integration Git de Pages (un seul des deux
# chemins, sinon deux deploiements concurrents) : voir la documentation.
#
# Le jeton n'est jamais affiche ; il ne sert qu'a l'etape de deploiement.

on:
  push:
    branches: [main]
    paths:
      - "mono/apps/mobile/**"
      - "mono/packages/core/**"
      - "mono/packages/data-utils/**"
      - ".github/workflows/cloudflare.yml"
  workflow_run:
    workflows: ["Collecte quotidienne"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deployer:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: mono/apps/mobile
    steps:
      - name: DIAGNOSTIC du jeton (branche diag, aucun deploiement, aucun secret affiche)
        working-directory: .
        run: |
          api() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4$1"; }
          echo "prefixe du jeton (public, format Cloudflare) : ${CLOUDFLARE_API_TOKEN:0:5} ; longueur ${#CLOUDFLARE_API_TOKEN}"
          echo "empreinte sha256 (8 premiers caracteres) : $(printf %s "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -c1-8)"
          a=$(api "/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify")
          echo "verify compte : succes=$(echo "$a" | jq -r .success) id=$(echo "$a" | jq -r '.result.id // "-"') statut=$(echo "$a" | jq -r '.result.status // "-"') debut=$(echo "$a" | jq -r '.result.not_before // "-"') fin=$(echo "$a" | jq -r '.result.expires_on // "-"')"
          u=$(api /user/tokens/verify)
          echo "verify utilisateur : succes=$(echo "$u" | jq -r .success) id=$(echo "$u" | jq -r '.result.id // "-"') statut=$(echo "$u" | jq -r '.result.status // "-"')"
          for p in /pages/projects /workers/scripts /tokens; do r=$(api "/accounts/$CLOUDFLARE_ACCOUNT_ID$p"); echo "GET $p : succes=$(echo "$r" | jq -r .success) erreurs=$(echo "$r" | jq -c '[.errors[]?|{code,message}]')"; done

      - name: Secrets presents ?
        id: secrets
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare Pages : secrets CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID absents, rien n'est deploye (docs/hebergement-cloudflare.md)."
            echo "pret=non" >> "$GITHUB_OUTPUT"
          else
            echo "pret=non" >> "$GITHUB_OUTPUT"  # branche diag : jamais de deploiement
          fi

      - uses: actions/checkout@v7
        if: steps.secrets.outputs.pret == 'oui'
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.pret == 'oui'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mono/apps/mobile/package-lock.json

      - name: Installer (verrou exact)
        if: steps.secrets.outputs.pret == 'oui'
        run: npm ci --no-audit --no-fund

      # MODE DEMO ET AVIS (17/11/2026, src/lib/avis.ts). Variables du depot (Settings > Secrets and variables >
      # Actions > Variables), pas des secrets : elles finissent dans le code servi. Par defaut : demo, et l'adresse
      # deja publiee du projet. FEEDBACK_EMAIL ne doit nommer qu'une adresse dont le porteur detient le domaine.
      - name: Construire (export web, donnees publiees, PWA, regles de routage)
        if: steps.secrets.outputs.pret == 'oui'
        env:
          EXPO_PUBLIC_APP_MODE: ${{ vars.APP_MODE || 'demo' }}
          EXPO_PUBLIC_CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL || 'repere0@protonmail.com' }}
          EXPO_PUBLIC_FEEDBACK_EMAIL: ${{ vars.FEEDBACK_EMAIL || vars.CONTACT_EMAIL || 'repere0@protonmail.com' }}
        run: npm run build:cloudflare

      # Le projet est cree au premier passage s'il n'existe pas (type « envoi direct »). Les fois suivantes, la
      # commande repond que le projet existe deja : ce n'est pas une erreur.
      - name: Creer le projet Pages si besoin
        if: steps.secrets.outputs.pret == 'oui'
        run: npx --yes wrangler@4.161.0 pages project create repere --production-branch=main || echo "projet deja present"

      - name: Deployer
        if: steps.secrets.outputs.pret == 'oui'
        run: |
          npx --yes wrangler@4.161.0 pages deploy dist --project-name=repere --branch=main \
            --commit-hash="${{ github.event.workflow_run.head_sha || github.sha }}" --commit-dirty=true
          echo "- Cloudflare Pages : deploye ($(date -u +%d/%m/%Y\ %H:%M) UTC)" >> "$GITHUB_STEP_SUMMARY"
